
name: toba_vision_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  http: ^1.2.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  device_info_plus: ^13.3.0
  tflite_flutter: ^0.12.1
  image: ^4.13.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon_1024.png"
  adaptive_icon_background: "#A3AB8E"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/branding/
    - assets/branding/icon_1024.png
    - assets/branding/icon_foreground.png
    - assets/ml/
